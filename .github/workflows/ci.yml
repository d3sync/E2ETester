name: Windows build and checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_publication.py
      - run: dotnet restore --locked-mode
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet run --project tests/E2ETester.IntegrationTests --configuration Release --no-build
      - run: python tools/test_mcp.py
      - name: WPF usability checks
        shell: pwsh
        run: |
          $app = (Resolve-Path 'src/E2ETester.Desktop/bin/Release/net10.0-windows/E2ETester.Desktop.exe').Path
          $p = Start-Process $app -ArgumentList '--smoke=artifacts/ci-ui.png','--usability-exercise','--dark' -WindowStyle Hidden -PassThru
          if (!$p.WaitForExit(60000)) { Stop-Process -Id $p.Id; throw 'UI test timed out' }
          if ($p.ExitCode -ne 0) { throw 'UI test failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-evidence
          path: artifacts/ci-ui.png*
